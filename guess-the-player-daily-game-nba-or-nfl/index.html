<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Silhouette Hoops — Guess the NBA Player</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #141b2d;
    --panel2: #1c2540;
    --ink: #eef2ff;
    --muted: #93a0c2;
    --accent: #ff6b35;
    --green: #2ecc71;
    --yellow: #f1c40f;
    --red: #e74c3c;
    --line: #2a3557;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #16203a, var(--bg));
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; padding: 18px 16px 60px; }
  header { text-align: center; margin-bottom: 12px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  /* Clip stage */
  .stage {
    position: relative;
    background: linear-gradient(180deg, #b5651d 0%, #a55a18 55%, #8f4d14 100%);
    border-radius: 16px;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border: 3px solid #6d3a0f;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  /* court lines */
  .stage::before {
    content: "";
    position: absolute; left: 50%; bottom: -60%;
    width: 220px; height: 220px;
    border: 3px solid rgba(255,255,255,.35);
    border-radius: 50%;
    transform: translateX(-50%);
  }
  .stage::after {
    content: "";
    position: absolute; left: 0; right: 0; top: 22%;
    height: 3px; background: rgba(255,255,255,.28);
  }
  .clip-label {
    position: absolute; top: 8px; left: 10px; z-index: 5;
    background: rgba(0,0,0,.45); color:#fff; padding: 3px 9px;
    border-radius: 999px; font-size: 11px; letter-spacing: .5px;
  }
  .rec {
    position:absolute; top: 8px; right: 10px; z-index:5;
    display:flex; align-items:center; gap:5px; font-size: 11px;
    background: rgba(0,0,0,.45); padding:3px 9px; border-radius:999px;
  }
  .rec .dot { width:8px; height:8px; border-radius:50%; background:#ff3b30; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }

  /* Silhouette figure (whited-out player) */
  .figure {
    position: absolute;
    left: 50%; bottom: 6%;
    transform: translateX(-50%);
    width: 120px; height: 210px;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.35));
  }
  .sil { fill: #ffffff; }
  .ball { fill: #ff8c1a; stroke:#7a3d0a; stroke-width:2; }

  /* motion per clip */
  .anim-dribble { animation: dribble 1.4s ease-in-out infinite; }
  .anim-shoot   { animation: shoot 2.2s ease-in-out infinite; }
  .anim-drive   { animation: drive 1.8s ease-in-out infinite; }
  .anim-dunk    { animation: dunk 2.0s ease-in-out infinite; }
  .anim-post    { animation: post 2.4s ease-in-out infinite; }
  @keyframes dribble { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-8px)} }
  @keyframes shoot { 0%,60%{transform:translateX(-50%) rotate(0)} 75%{transform:translateX(-50%) translateY(-14px)} 100%{transform:translateX(-50%)} }
  @keyframes drive { 0%,100%{transform:translateX(-64%)} 50%{transform:translateX(-36%)} }
  @keyframes dunk { 0%,100%{transform:translateX(-50%) translateY(0)} 40%{transform:translateX(-50%) translateY(-24px)} }
  @keyframes post { 0%,100%{transform:translateX(-54%) rotate(-3deg)} 50%{transform:translateX(-46%) rotate(3deg)} }

  .clip-hint {
    position:absolute; bottom:8px; left:0; right:0; text-align:center;
    color:rgba(255,255,255,.85); font-size:12px; z-index:5; text-shadow:0 1px 2px rgba(0,0,0,.5);
  }

  /* Guess input */
  .guessbar { position: relative; margin-top: 14px; }
  .guessbar input {
    width: 100%; padding: 13px 14px; font-size: 15px;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); outline: none;
  }
  .guessbar input:focus { border-color: var(--accent); }
  .ac {
    position: absolute; z-index: 20; left: 0; right: 0; top: 52px;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 12px; max-height: 220px; overflow-y: auto;
    box-shadow: 0 12px 24px rgba(0,0,0,.5);
  }
  .ac div { padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--line); }
  .ac div:last-child { border-bottom: none; }
  .ac div:hover, .ac div.active { background: var(--accent); color: #101010; }
  .ac .meta { color: var(--muted); font-size: 12px; }
  .ac div:hover .meta, .ac div.active .meta { color:#3a1f0a; }

  .btn {
    margin-top: 10px; width: 100%; padding: 13px; border: none; cursor: pointer;
    background: var(--accent); color: #10141f; font-weight: 700; font-size: 15px;
    border-radius: 12px;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .attempts { text-align:center; color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* Guess rows */
  .rows { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid; grid-template-columns: 1.5fr repeat(4, 1fr); gap: 6px;
    align-items: stretch;
  }
  .cell {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 6px; text-align: center;
    font-size: 11px; line-height: 1.25;
  }
  .cell .k { display:block; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing:.5px; }
  .cell .v { display:block; font-weight: 600; margin-top: 2px; }
  .cell.name { text-align:left; background: var(--panel2); font-size:12px; }
  .cell.g { background: var(--green); color:#06210f; border-color: var(--green); }
  .cell.y { background: var(--yellow); color:#3a2f04; border-color: var(--yellow); }
  .cell.r { background: var(--red); color:#2c0806; border-color: var(--red); }
  .head { color: var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.5px; }

  /* End screen */
  .end { margin-top: 16px; background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; text-align:center; }
  .end h2 { margin: 0 0 6px; }
  .end .ans { font-size: 20px; color: var(--accent); font-weight:800; }
  .grid { font-size: 22px; letter-spacing:2px; line-height: 1.5; margin: 12px 0; white-space: pre; }
  .end small { color: var(--muted); }
  .legend { margin-top:10px; color:var(--muted); font-size:11px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .legend b { color: var(--ink); font-weight:600; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Silhouette <span>Hoops</span></h1>
    <p>The player is whited out. Guess who it is in 5 tries.</p>
  </header>

  <div class="stage" id="stage">
    <div class="clip-label" id="clipLabel">CLIP 1 / 5</div>
    <div class="rec"><span class="dot"></span>REC</div>
    <div id="figWrap"></div>
    <div class="clip-hint" id="clipHint"></div>
  </div>

  <div class="guessbar" id="guessWrap">
    <input id="guess" type="text" placeholder="Type a player name…" autocomplete="off" />
    <div class="ac hidden" id="ac"></div>
    <button class="btn" id="submit">Guess</button>
    <div class="attempts" id="attemptsInfo"></div>
  </div>

  <div class="rows" id="rows"></div>

  <div class="end hidden" id="end"></div>
</div>

<script>
/* ---------- Mock data: 12 NBA players (silhouette clip metadata) ---------- */
const PLAYERS = [
  { name:"Stephen Curry",     team:"Warriors",   conf:"West", div:"Pacific",   pos:"Guard",   jersey:"Blue/Gold",  pose:"anim-shoot",   hint:"Behind-the-arc launch" },
  { name:"LeBron James",      team:"Lakers",     conf:"West", div:"Pacific",   pos:"Forward", jersey:"Purple/Gold",pose:"anim-drive",   hint:"Coast-to-coast drive" },
  { name:"Giannis Antetokounmpo", team:"Bucks",  conf:"East", div:"Central",   pos:"Forward", jersey:"Green/Cream",pose:"anim-dunk",    hint:"Euro-step to the rim" },
  { name:"Nikola Jokic",      team:"Nuggets",    conf:"West", div:"Northwest", pos:"Center",  jersey:"Navy/Gold",  pose:"anim-post",    hint:"Bully post move" },
  { name:"Kevin Durant",      team:"Suns",       conf:"West", div:"Pacific",   pos:"Forward", jersey:"Purple/Orange",pose:"anim-shoot", hint:"High-release jumper" },
  { name:"Luka Doncic",       team:"Mavericks",  conf:"West", div:"Southwest", pos:"Guard",   jersey:"Blue/White", pose:"anim-drive",   hint:"Step-back setup" },
  { name:"Joel Embiid",       team:"76ers",      conf:"East", div:"Atlantic",  pos:"Center",  jersey:"Blue/Red",   pose:"anim-post",    hint:"Face-up in the post" },
  { name:"Jayson Tatum",      team:"Celtics",    conf:"East", div:"Atlantic",  pos:"Forward", jersey:"Green/White",pose:"anim-shoot",   hint:"Elbow pull-up" },
  { name:"Damian Lillard",    team:"Bucks",      conf:"East", div:"Central",   pos:"Guard",   jersey:"Green/Cream",pose:"anim-shoot",   hint:"Deep logo three" },
  { name:"Ja Morant",         team:"Grizzlies",  conf:"West", div:"Southwest", pos:"Guard",   jersey:"Navy/Blue",  pose:"anim-dunk",    hint:"High-flying finish" },
  { name:"Anthony Davis",     team:"Lakers",     conf:"West", div:"Pacific",   pos:"Center",  jersey:"Purple/Gold",pose:"anim-post",    hint:"Interior anchor" },
  { name:"Jimmy Butler",      team:"Heat",       conf:"East", div:"Southeast", pos:"Forward", jersey:"Red/Black",  pose:"anim-drive",   hint:"Physical downhill drive" },
];

/* SVG silhouette body — same for every player (that's the whole point) */
function svgFor(){
  return `
  <svg class="figure ANIM" viewBox="0 0 120 210" xmlns="http://www.w3.org/2000/svg">
    <circle class="sil" cx="60" cy="26" r="18"/>
    <rect class="sil" x="44" y="44" width="32" height="60" rx="14"/>
    <rect class="sil" x="30" y="52" width="16" height="46" rx="8" transform="rotate(18 38 75)"/>
    <rect class="sil" x="74" y="46" width="16" height="46" rx="8" transform="rotate(-28 82 69)"/>
    <rect class="sil" x="46" y="100" width="14" height="70" rx="7" transform="rotate(6 53 135)"/>
    <rect class="sil" x="62" y="100" width="14" height="70" rx="7" transform="rotate(-8 69 135)"/>
    <circle class="ball" cx="96" cy="40" r="12"/>
  </svg>`;
}

/* ---------- Daily answer (deterministic per date) ---------- */
function todaySeed(){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}
const answer = PLAYERS[ todaySeed() % PLAYERS.length ];

/* clip order: answer's own poses cycled to give varied "footage" */
const CLIP_HINTS = [answer.hint, "Different angle", "Slow-mo replay", "Sideline cam", "Baseline cam"];
const CLIP_POSES = [answer.pose, "anim-drive", "anim-dribble", "anim-shoot", "anim-dunk"];

const MAX = 5;
let attempt = 0;
let over = false;
const guesses = [];

/* ---------- DOM ---------- */
const figWrap = document.getElementById('figWrap');
const clipLabel = document.getElementById('clipLabel');
const clipHint = document.getElementById('clipHint');
const input = document.getElementById('guess');
const ac = document.getElementById('ac');
const submitBtn = document.getElementById('submit');
const rowsEl = document.getElementById('rows');
const endEl = document.getElementById('end');
const attemptsInfo = document.getElementById('attemptsInfo');
const guessWrap = document.getElementById('guessWrap');

function showClip(i){
  figWrap.innerHTML = svgFor().replace('ANIM', CLIP_POSES[i]);
  clipLabel.textContent = `CLIP ${i+1} / ${MAX}`;
  clipHint.textContent = CLIP_HINTS[i];
}
showClip(0);
updateAttempts();

function updateAttempts(){
  attemptsInfo.textContent = `Attempt ${Math.min(attempt+1,MAX)} of ${MAX}`;
}

/* ---------- Autocomplete ---------- */
let acItems = [], acIndex = -1;
input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  if(!q){ hideAc(); return; }
  const guessed = new Set(guesses.map(g=>g.name));
  acItems = PLAYERS.filter(p => p.name.toLowerCase().includes(q) && !guessed.has(p.name)).slice(0,6);
  if(!acItems.length){ hideAc(); return; }
  ac.innerHTML = acItems.map((p,idx)=>
    `<div data-i="${idx}"><span>${p.name}</span> <span class="meta">${p.team} · ${p.pos}</span></div>`
  ).join('');
  ac.classList.remove('hidden');
  acIndex = -1;
  [...ac.children].forEach(c=>c.addEventListener('click',()=>pick(+c.dataset.i)));
});
function hideAc(){ ac.classList.add('hidden'); ac.innerHTML=''; acItems=[]; acIndex=-1; }
function pick(i){ input.value = acItems[i].name; hideAc(); input.focus(); }

input.addEventListener('keydown', (e)=>{
  if(ac.classList.contains('hidden')){
    if(e.key==='Enter') doGuess();
    return;
  }
  if(e.key==='ArrowDown'){ e.preventDefault(); acIndex=(acIndex+1)%acItems.length; paintAc(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); acIndex=(acIndex-1+acItems.length)%acItems.length; paintAc(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(acIndex>=0) pick(acIndex); else doGuess(); }
  else if(e.key==='Escape'){ hideAc(); }
});
function paintAc(){ [...ac.children].forEach((c,i)=>c.classList.toggle('active', i===acIndex)); }

document.addEventListener('click',(e)=>{ if(!guessWrap.contains(e.target)) hideAc(); });

/* ---------- Guess logic ---------- */
submitBtn.addEventListener('click', doGuess);

function cls(state){ return state==='g'?'g':state==='y'?'y':'r'; }

function evaluate(p){
  return {
    team:  p.team===answer.team ? 'g' : 'r',
    conf:  p.conf===answer.conf ? 'g' : 'r',
    pos:   p.pos===answer.pos ? 'g'
           : (posGroup(p.pos)===posGroup(answer.pos) ? 'y' : 'r'),
    div:   p.div===answer.div ? 'g'
           : (p.conf===answer.conf ? 'y' : 'r'),
    jersey: p.jersey===answer.jersey ? 'g'
           : sharesColor(p.jersey, answer.jersey) ? 'y' : 'r',
  };
}
function posGroup(pos){ return pos==='Center' ? 'big' : pos==='Forward' ? 'big' : 'perimeter'; }
function sharesColor(a,b){
  const A=a.toLowerCase().split('/'), B=b.toLowerCase().split('/');
  return A.some(c=>B.includes(c));
}

function doGuess(){
  if(over) return;
  const name = input.value.trim();
  const p = PLAYERS.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!p){ input.focus(); input.style.borderColor='var(--red)'; setTimeout(()=>input.style.borderColor='',600); return; }
  if(guesses.some(g=>g.name===p.name)) return;

  const ev = evaluate(p);
  const correct = p.name===answer.name;
  guesses.push({name:p.name, ev, correct});
  renderRows();
  input.value=''; hideAc();
  attempt++;

  if(correct){ finish(true); return; }
  if(attempt>=MAX){ finish(false); return; }
  showClip(attempt);
  updateAttempts();
}

function renderRows(){
  const header = `<div class="row">
    <div class="head" style="text-align:left">Guess</div>
    <div class="head">Team</div>
    <div class="head">Conf</div>
    <div class="head">Pos</div>
    <div class="head">Jersey</div>
  </div>`;
  rowsEl.innerHTML = header + guesses.map(g=>{
    const p = PLAYERS.find(x=>x.name===g.name);
    return `<div class="row">
      <div class="cell name">${g.name}</div>
      <div class="cell ${g.ev.team}"><span class="v">${p.team}</span></div>
      <div class="cell ${g.ev.conf}"><span class="v">${p.conf}</span></div>
      <div class="cell ${g.ev.pos}"><span class="v">${p.pos}</span></div>
      <div class="cell ${g.ev.jersey}"><span class="v">${p.jersey}</span></div>
    </div>`;
  }).join('');
}

/* ---------- End screen + share ---------- */
function emojiFor(s){ return s==='g'?'🟩':s==='y'?'🟨':'🟥'; }
function buildGrid(){
  return guesses.map(g=>{
    if(g.correct) return '🟩🟩🟩🟩🟩';
    return emojiFor(g.ev.team)+emojiFor(g.ev.conf)+emojiFor(g.ev.pos)+emojiFor(g.ev.jersey)+'⬛';
  }).join('\n');
}

function finish(won){
  over = true;
  guessWrap.classList.add('hidden');
  // reveal player: tint silhouette accent to signal "revealed"
  clipLabel.textContent = 'REVEALED';
  clipHint.textContent = answer.hint;
  const grid = buildGrid();
  const shareText = `Silhouette Hoops #${todaySeed()}\n${won? guesses.length : 'X'}/${MAX}\n${grid}`;
  endEl.classList.remove('hidden');
  endEl.innerHTML = `
    <h2>${won ? '🏀 Nailed it!' : 'So close!'}</h2>
    <div class="ans">${answer.name}</div>
    <small>${answer.team} · ${answer.conf} · ${answer.pos} · ${answer.jersey}</small>
    <div class="grid">${grid}</div>
    <button class="btn" id="shareBtn">Copy share result</button>
    <div class="legend">
      <span>🟩 <b>exact</b></span>
      <span>🟨 <b>partial</b></span>
      <span>🟥 <b>miss</b></span>
    </div>
    <div class="legend" style="margin-top:6px">Order: Team · Conf · Pos · Jersey</div>
  `;
  document.getElementById('shareBtn').addEventListener('click', ()=>{
    navigator.clipboard?.writeText(shareText).then(()=>{
      const b=document.getElementById('shareBtn'); b.textContent='Copied! ✅';
      setTimeout(()=>b.textContent='Copy share result',1600);
    }).catch(()=>{ prompt('Copy your result:', shareText); });
  });
  endEl.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
